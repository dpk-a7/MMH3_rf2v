[package]
name = "minimax-h3-backend"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1.43", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "limit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
rmp-serde = "1.3"
uuid = { version = "1.12", features = ["v4", "serde"] }
dashmap = "6.1"
nvml-wrapper = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
x25519-dalek = "2.0"
aes-gcm = "0.10"
sha2 = "0.10"
hkdf = "0.12"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
base64 = "0.22"
rand = "0.8"
bytes = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "unwind"
